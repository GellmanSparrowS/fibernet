name: Release FiberScope Windows

on:
  push:
    tags: ['v4.2.0']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU training runtime for the complete desktop suite
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install build and test dependencies
        run: python -m pip install -r FiberScope/requirements-rl.txt -r FiberScope/requirements-dev.txt networkx matplotlib trimesh
      - name: Check release identities
        shell: pwsh
        run: |
          python -c "import fibernet.version as f; assert f.__version__ == '4.2.0'"
          python -c "import sys; sys.path.insert(0, 'FiberScope'); from fslab.version import APP_VERSION; assert APP_VERSION == '3.1.0'"
      - name: Run desktop suites
        run: python FiberScope/scripts/run_tests.py
      - name: Build and smoke-test frozen APP
        run: python FiberScope/scripts/build_exe.py --onedir
      - name: Package verified folder
        shell: pwsh
        run: |
          $archive = 'FiberScope-3.1.0-Windows-x64.zip'
          Compress-Archive -LiteralPath 'FiberScope/dist/FiberScope' -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'SHA256SUMS.txt' -Value "$hash  $archive" -Encoding utf8NoBOM
          if ((Get-Item -LiteralPath $archive).Length -lt 50000000) { throw 'Unexpectedly small desktop archive' }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4.2.0 'FiberScope-3.1.0-Windows-x64.zip' 'SHA256SUMS.txt' --verify-tag --title 'FiberNet 4.2.0 / FiberScope 3.1.0' --notes-file 'docs/RELEASE_4_2_0.md'
