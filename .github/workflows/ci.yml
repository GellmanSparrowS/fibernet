name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'fibernet/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  CI: "true"
  MPLBACKEND: "Agg"
  TI_DISABLE_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify core-only macOS Python 3.9 dependency contract
      if: runner.os == 'macOS' && matrix.python-version == '3.9'
      run: |
        python -c "import importlib.util; assert importlib.util.find_spec('taichi') is None"
        pytest tests/test_architecture_api_journeys.py::test_default_spring_dependency_is_explicit_when_unavailable -v

    - name: Diagnose portable generation equivalence
      run: pytest tests/test_voronoi_owned_bridge.py -q -rP -o addopts=""

    - name: Run tests (Unix)
      if: runner.os != 'Windows'
      run: pytest tests/ -v --tb=short

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: pytest tests/ -v --tb=short -o addopts="" -k "not (TestSimulation3D or TestVisualization3D or TestEnergyComputation or TestOOMGuard)"

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

