name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'fibernet/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  CI: "true"
  MPLBACKEND: "Agg"
  TI_DISABLE_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests (Unix)
      if: runner.os != 'Windows'
      run: pytest tests/ -v --tb=short

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: pytest tests/ -v --tb=short -o addopts="" -k "not (TestSimulation3D or TestVisualization3D or TestEnergyComputation or TestOOMGuard)"

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  verify-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Verify published package version
      run: |
        python -c "import json,urllib.request; data=json.load(urllib.request.urlopen('https://pypi.org/pypi/fibernet/4.2.0/json',timeout=20)); assert data['info']['version']=='4.2.0'; assert len(data['urls']) >= 2"
