name: Verify published PyPI package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already published to PyPI
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check exact published metadata
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PYCODE'
          import json, os, re, urllib.request
          version = os.environ['EXPECTED_VERSION']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          url = 'https://pypi.org/pypi/fibernet/' + version + '/json'
          data = json.load(urllib.request.urlopen(url, timeout=20))
          assert data['info']['version'] == version
          assert {x['packagetype'] for x in data['urls']} >= {'sdist', 'bdist_wheel'}
          PYCODE
      - name: Install and verify exact wheel version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --only-binary=:all: "fibernet[fracture]==$EXPECTED_VERSION"
          python -c "import os, fibernet; assert fibernet.__version__ == os.environ['EXPECTED_VERSION']; from fibernet.sim.fracture import FractureConfig, FractureSolver"
