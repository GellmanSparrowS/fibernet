name: Publish core package to PyPI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - fibernet/version.py
      - .github/workflows/publish-pypi.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to publish (40-character SHA)
        required: true
        type: string
      expected_version:
        description: Exact unpublished core version
        required: true
        type: string

permissions: {}
concurrency:
  group: fibernet-pypi-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    name: Core wheel and sdist checks
    if: github.repository == 'GellmanSparrowS/fibernet' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      checks: ${{ steps.ci.outputs.checks }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      manifest: ${{ steps.packages.outputs.manifest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ''
      MPLBACKEND: Agg
    steps:
      - name: Wait for exact main CI, including all matrix and CPU training jobs
        id: ci
        if: github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            if (context.eventName === 'workflow_dispatch' && process.env.EXPECTED_SHA !== context.sha)
              throw new Error('Dispatch SHA does not match the selected main commit');
            const repo = context.repo;
            const matrix = ['ubuntu-latest', 'macos-latest', 'windows-latest'].flatMap(os =>
              ['3.9', '3.10', '3.11', '3.12'].map(py => `test (${os}, ${py})`));
            const required = {
              'ci.yml': [...matrix, 'CPU training contracts (Python 3.12)'],
              'mcp.yml': ['linux-stdio']
            };
            const started = Date.now();
            const deadline = started + 90 * 60 * 1000;
            while (Date.now() < deadline) {
              const {data: ref} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
              if (ref.object.sha !== context.sha) throw new Error('Main advanced; release is stale');
              const checks = {};
              let waiting = false;
              for (const [workflow, names] of Object.entries(required)) {
                const {data} = await github.rest.actions.listWorkflowRuns({
                  ...repo, workflow_id: workflow, branch: 'main', event: 'push',
                  head_sha: context.sha, per_page: 100
                });
                if (data.total_count > 100) throw new Error('Too many matching runs; inspect manually');
                const run = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
                if (!run) {
                  if (Date.now() - started > 5 * 60 * 1000) throw new Error(`Missing exact-SHA ${workflow}`);
                  waiting = true;
                  continue;
                }
                if (run.head_sha !== context.sha || run.head_branch !== 'main' || run.event !== 'push' ||
                    run.path !== `.github/workflows/${workflow}` || run.repository.full_name !== context.payload.repository.full_name)
                  throw new Error(`Unexpected identity for ${workflow}`);
                if (run.status !== 'completed') { waiting = true; continue; }
                if (run.conclusion !== 'success') throw new Error(`${workflow}: ${run.conclusion}`);
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...repo, run_id: run.id, filter: 'latest', per_page: 100
                });
                const accepted = [];
                for (const name of names) {
                  const matches = jobs.filter(job => job.name === name);
                  if (matches.length !== 1 || matches[0].head_sha !== context.sha ||
                      matches[0].status !== 'completed' || matches[0].conclusion !== 'success')
                    throw new Error(`Missing or unsuccessful required job: ${name}`);
                  const job = matches[0];
                  const step = name.startsWith('test (')
                    ? (name.includes('windows-latest') ? 'Run tests (Windows)' : 'Run tests (Unix)')
                    : name === 'linux-stdio' ? 'Run bounded complete adapter suite'
                    : 'Verify CPU runtime and run focused training contracts without skips';
                  if (!job.steps.some(s => s.name === step && s.status === 'completed' && s.conclusion === 'success'))
                    throw new Error(`Required test step did not succeed: ${name}`);
                  accepted.push(job.id);
                }
                checks[workflow] = {id: run.id, attempt: run.run_attempt, jobs: accepted};
              }
              if (!waiting) { core.setOutput('checks', JSON.stringify(checks)); return; }
              core.info('Waiting for both workflows on the exact main SHA');
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Exact-SHA CI did not finish within the release wait budget');

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Freeze the core version and check release availability
        id: version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import ast, json, os, pathlib, re, tomllib, urllib.request
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          version = project['version']
          assert project['name'] == 'fibernet' and re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          tree = ast.parse(pathlib.Path('fibernet/version.py').read_text())
          versions = [ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign)
                      and any(isinstance(t, ast.Name) and t.id == '__version__' for t in node.targets)]
          assert versions == [version], 'Core source and package versions differ'
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              assert os.environ['EXPECTED_VERSION'] == version, 'Dispatch version mismatch'
          should_publish = os.environ['GITHUB_EVENT_NAME'] != 'pull_request'
          if should_publish:
              request = urllib.request.Request('https://pypi.org/pypi/fibernet/json', headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  published = json.load(response)
              if version in published['releases']:
                  assert os.environ['GITHUB_EVENT_NAME'] == 'push', 'Version already exists on PyPI'
                  should_publish = False
                  print(f'Version {version} is already on PyPI; validate distributions without publishing')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
              out.write(f'publish={str(should_publish).lower()}\n')
          PY
      - name: Build the sdist and its wheel with official PyPA tools
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple "build==1.6.1" "twine==7.0.0" "setuptools==84.2.1" "wheel==0.48.0"
          python -m pip freeze
          # The default builds the wheel from the sdist, not a second source tree.
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build --no-isolation
          python -m twine check --strict dist/*
      - name: Check metadata and freeze package hashes
        id: packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import email, hashlib, json, os, pathlib, tarfile, zipfile
          version = os.environ['VERSION']
          files = sorted(pathlib.Path('dist').iterdir())
          assert {p.name for p in files} == {f'fibernet-{version}-py3-none-any.whl', f'fibernet-{version}.tar.gz'}
          manifest = {'sha': os.environ['GITHUB_SHA'], 'version': version, 'files': {}}
          for path in files:
              assert path.is_file() and not path.is_symlink()
              if path.suffix == '.whl':
                  with zipfile.ZipFile(path) as archive:
                      metadata = archive.read(f'fibernet-{version}.dist-info/METADATA')
                      assert not any(n.startswith(('fibernet_mcp/', 'fibernet_mcp-')) for n in archive.namelist())
              else:
                  with tarfile.open(path) as archive:
                      metadata = archive.extractfile(f'fibernet-{version}/PKG-INFO').read()
              message = email.message_from_bytes(metadata)
              assert message['Name'] == 'fibernet' and message['Version'] == version
              assert message.get_all('Author', []) == ['Yunhao Yang'], 'Release author mismatch'
              assert message.get_all('Author-email', []) == [], 'Unexpected release author email'
              manifest['files'][path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('manifest=' + json.dumps(manifest, separators=(',', ':')) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Clean-install and smoke-test both exact distributions outside the checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for package in "$GITHUB_WORKSPACE"/dist/*; do
            environment=$(mktemp -d "$RUNNER_TEMP/core-install.XXXXXX")
            python -m venv "$environment"
            "$environment/bin/python" -m pip --isolated install --index-url https://pypi.org/simple "$package"
            "$environment/bin/python" -m pip check
            (cd "$RUNNER_TEMP" && "$environment/bin/python" -I - <<'PY'
          import importlib.metadata, os, pathlib, sys
          import fibernet
          assert fibernet.__version__ == importlib.metadata.version('fibernet') == os.environ['VERSION']
          assert pathlib.Path(fibernet.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())
          graph = fibernet.pattern_2d(unit='square', box=(2, 2), grid=(1, 1))
          assert graph.num_nodes > 0 and graph.num_edges > 0
          print('Installed core smoke passed:', fibernet.__version__, fibernet.__file__)
          PY
            )
          done
      - name: Store the exact checked distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fibernet-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    if: github.repository == 'GellmanSparrowS/fibernet' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      # No repository checkout, package installation, or project code runs here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
          digest-mismatch: error
      - name: Recheck main, CI attempts, package hashes, and fresh PyPI availability
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PYPI_TOKEN_PRESENT: ${{ secrets.PYPI_API_TOKEN != '' }}
          CHECKS: ${{ needs.build.outputs.checks }}
          MANIFEST: ${{ needs.build.outputs.manifest }}
          VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            if (process.env.PYPI_TOKEN_PRESENT !== 'true')
              throw new Error('Required repository secret PYPI_API_TOKEN is not configured');
            const fs = require('fs');
            const crypto = require('crypto');
            const repo = context.repo;
            const checks = JSON.parse(process.env.CHECKS);
            const manifest = JSON.parse(process.env.MANIFEST);
            if (manifest.sha !== context.sha || manifest.version !== process.env.VERSION ||
                !/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error('Release identity mismatch');
            if (Object.keys(checks).sort().join(',') !== 'ci.yml,mcp.yml') throw new Error('Missing required workflows');
            for (const [workflow, accepted] of Object.entries(checks)) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: workflow, branch: 'main', event: 'push', head_sha: context.sha, per_page: 100
              });
              const run = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
              if (data.total_count > 100 || !run || run.id !== accepted.id || run.run_attempt !== accepted.attempt ||
                  run.head_sha !== context.sha || run.head_branch !== 'main' || run.event !== 'push' ||
                  run.path !== `.github/workflows/${workflow}` || run.status !== 'completed' || run.conclusion !== 'success')
                throw new Error(`CI changed or is no longer successful: ${workflow}`);
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: run.id, filter: 'latest', per_page: 100
              });
              if (accepted.jobs.length !== (workflow === 'ci.yml' ? 13 : 1) || accepted.jobs.some(id =>
                  !jobs.some(job => job.id === id && job.head_sha === context.sha && job.status === 'completed' && job.conclusion === 'success')))
                throw new Error(`Required jobs changed: ${workflow}`);
            }
            const names = [`fibernet-${manifest.version}-py3-none-any.whl`, `fibernet-${manifest.version}.tar.gz`].sort();
            if (JSON.stringify(Object.keys(manifest.files).sort()) !== JSON.stringify(names) ||
                JSON.stringify(fs.readdirSync('dist').sort()) !== JSON.stringify(names))
              throw new Error('Unexpected distribution files');
            for (const name of names) {
              const path = `dist/${name}`;
              if (!fs.lstatSync(path).isFile() ||
                  crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex') !== manifest.files[name])
                throw new Error(`Distribution changed: ${name}`);
            }
            const response = await fetch('https://pypi.org/pypi/fibernet/json', {
              headers: {'Cache-Control': 'no-cache'}, signal: AbortSignal.timeout(30000)
            });
            if (!response.ok) throw new Error(`PyPI availability check failed: ${response.status}`);
            const project = await response.json();
            if (Object.hasOwn(project.releases, manifest.version)) throw new Error('Version already exists on PyPI');
            const {data: ref} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
            if (ref.object.sha !== context.sha) throw new Error('Main advanced; release is stale');
      - name: Publish the unchanged core wheel and sdist to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: false
          attestations: false
          verbose: false

  verify-published:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify PyPI exposes exactly the uploaded hashes
        env:
          MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          manifest = json.loads(os.environ['MANIFEST'])
          url = 'https://pypi.org/pypi/fibernet/' + manifest['version'] + '/json'
          deadline = time.monotonic() + 300
          while True:
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      published = json.load(response)
                  actual = {entry['filename']: entry['digests']['sha256'] for entry in published['urls']}
                  if actual == manifest['files'] and published['info']['version'] == manifest['version']:
                      print('Published wheel and sdist match the accepted hashes')
                      break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              if time.monotonic() >= deadline:
                  raise RuntimeError('Published files were not visible with the accepted hashes')
              time.sleep(15)
          PY
      - name: Install the exact published wheel and smoke-test it
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MPLBACKEND: Agg
        run: |
          python -m venv "$RUNNER_TEMP/published-core"
          "$RUNNER_TEMP/published-core/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: "fibernet==$VERSION"
          "$RUNNER_TEMP/published-core/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/published-core/bin/python" -I - <<'PY'
          import importlib.metadata, os, fibernet
          assert fibernet.__version__ == importlib.metadata.version('fibernet') == os.environ['VERSION']
          graph = fibernet.pattern_2d(unit='square', box=(2, 2), grid=(1, 1))
          assert graph.num_nodes > 0 and graph.num_edges > 0
          print('Published core smoke passed:', fibernet.__version__, fibernet.__file__)
          PY

