name: FiberScope 3.0
on:
  push:
    branches: [main]
    paths: ['FiberScope/**', 'web_demo/**', '.github/workflows/fiberscope.yml']
  pull_request:
    paths: ['FiberScope/**', 'web_demo/**', '.github/workflows/fiberscope.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r FiberScope/requirements.txt networkx matplotlib trimesh
      - run: python FiberScope/scripts/run_tests.py
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r web_demo/requirements.txt
      - run: python web_demo/test_demo.py
